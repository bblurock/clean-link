name: Report a bug
description: A link changed incorrectly, or something in the extension did not work.
body:
  - type: markdown
    attributes:
      value: Please replace personal IDs, tokens, private content, and account details with safe examples. Public issues are visible to everyone.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected and the steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Sample link and expected result
      description: Use made-up values. For a cleaning problem, keep the relevant hostname, path shape, and parameter names.
      render: text
  - type: textarea
    id: settings
    attributes:
      label: Custom rules and versions
      description: Include additional/always-keep rules, macOS, Raycast, and TidyShareLink version or commit.
